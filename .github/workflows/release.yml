name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version segment to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    branches:
      - main
    paths:
      - VERSION

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    name: Prepare release PR
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Ensure release runs from main
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Run this workflow from main." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Configure git author
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump VERSION with semver
        id: version
        shell: bash
        run: |
          set -euo pipefail

          current_version="$(tr -d '[:space:]' < VERSION)"
          next_version="$(npx --yes semver@7.6.3 "${current_version}" -i "${{ inputs.bump }}")"
          release_branch="release/v${next_version}"

          if [[ -z "${next_version}" ]]; then
            echo "semver did not produce a version." >&2
            exit 1
          fi

          printf '%s\n' "${next_version}" > VERSION

          echo "current=${current_version}" >> "$GITHUB_OUTPUT"
          echo "next=${next_version}" >> "$GITHUB_OUTPUT"
          echo "branch=${release_branch}" >> "$GITHUB_OUTPUT"

      - name: Inspect release refs
        id: refs
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.next }}"
          branch="${{ steps.version.outputs.branch }}"

          if git ls-remote --exit-code --tags origin "refs/tags/${version}" >/dev/null 2>&1; then
            echo "Tag ${version} already exists." >&2
            exit 1
          fi

          if gh release view "${version}" >/dev/null 2>&1; then
            echo "Release ${version} already exists." >&2
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            echo "branch_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          ./build.sh

      - name: Update CHANGELOG
        id: changelog
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.next }}"
          prev_tag="${{ steps.version.outputs.current }}"
          # Resolve to a real git tag (tags have no v-prefix in this repo)
          if ! git rev-parse "${prev_tag}" >/dev/null 2>&1; then
            prev_tag="$(git describe --tags --abbrev=0 2>/dev/null || echo "")"
          fi
          today="$(date -u +%Y-%m-%d)"

          # Collect conventional commits since the previous tag
          features=""
          fixes=""
          while IFS= read -r line; do
            msg="${line#* }"
            if [[ "${msg}" == feat:* || "${msg}" == feat\(*\):* ]]; then
              entry="- ${msg#feat: }"
              entry="${entry#feat(*): }"
              features="${features}${entry}"$'\n'
            elif [[ "${msg}" == fix:* || "${msg}" == fix\(*\):* ]]; then
              entry="- ${msg#fix: }"
              entry="${entry#fix(*): }"
              fixes="${fixes}${entry}"$'\n'
            fi
          done < <(git log "${prev_tag}..HEAD" --oneline --no-merges 2>/dev/null || git log --oneline --no-merges)

          # Build the new changelog section
          new_section="## [${version}] - ${today}"$'\n'
          if [[ -n "${features}" ]]; then
            new_section+=$'\n### Features\n\n'"${features}"
          fi
          if [[ -n "${fixes}" ]]; then
            new_section+=$'\n### Bug Fixes\n\n'"${fixes}"
          fi

          # Prepend the new section after the header lines
          tmp="$(mktemp)"
          awk -v section="${new_section}" '
            /^## \[/ && !inserted { print section; print ""; inserted=1 }
            { print }
          ' CHANGELOG.md > "${tmp}"
          mv "${tmp}" CHANGELOG.md

      - name: Create or reuse release branch
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.next }}"
          branch="${{ steps.version.outputs.branch }}"
          branch_exists="${{ steps.refs.outputs.branch_exists }}"

          if [[ "${branch_exists}" == "true" ]]; then
            git restore --source=HEAD --staged --worktree VERSION CHANGELOG.md
            git fetch origin "${branch}"
            git switch -C "${branch}" "origin/${branch}"

            branch_version="$(tr -d '[:space:]' < VERSION)"
            if [[ "${branch_version}" != "${version}" ]]; then
              echo "Existing ${branch} has VERSION ${branch_version}, expected ${version}." >&2
              exit 1
            fi

            exit 0
          fi

          git switch -c "${branch}"
          printf '%s\n' "${version}" > VERSION
          git add VERSION CHANGELOG.md
          git commit -m "chore(release): ${version}" -m "- bump VERSION to ${version}" -m "- update CHANGELOG.md"
          git push --set-upstream origin "${branch}"

      - name: Open or reuse release pull request
        id: pr
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.next }}"
          branch="${{ steps.version.outputs.branch }}"
          pr_body="$(
            printf '## Summary\n- bump VERSION to %s\n- prepare the %s release\n\n## Validation\n- `./build.sh`\n' "${version}" "${version}"
          )"

          pr_url="$(gh pr list --head "${branch}" --base main --state open --json url --jq '.[0].url')"
          if [[ -z "${pr_url}" || "${pr_url}" == "null" ]]; then
            pr_url="$(gh pr create --base main --head "${branch}" --title "chore(release): ${version}" --body "${pr_body}")"
          fi

          echo "url=${pr_url}" >> "$GITHUB_OUTPUT"

      - name: Write pull request summary
        shell: bash
        run: |
          {
            printf 'Release pull request: %s\n' "${{ steps.pr.outputs.url }}"
            printf 'Publish is skipped on workflow_dispatch by design.\n'
            printf 'Merge that pull request into main to trigger the publish job.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.event_name == 'push'
    name: Publish release
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          archive_path="${RUNNER_TEMP}/${version}.zip"

          if [[ -z "${version}" ]]; then
            echo "VERSION file is empty." >&2
            exit 1
          fi

          echo "value=${version}" >> "$GITHUB_OUTPUT"
          echo "archive=${archive_path}" >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.value }}"

          if gh release view "${version}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build screen saver
        if: steps.release.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          ./build.sh

      - name: Stage release files
        if: steps.release.outputs.exists != 'true'
        id: stage
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.value }}"
          release_dir="${RUNNER_TEMP}/MatrixScreenSaver-${version}"

          rm -rf "${release_dir}"
          mkdir -p "${release_dir}"
          ditto "build/MatrixScreenSaver.saver" "${release_dir}/MatrixScreenSaver.saver"

          echo "dir=${release_dir}" >> "$GITHUB_OUTPUT"

      - name: Create release archive
        if: steps.release.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          ditto -c -k --sequesterRsrc "${{ steps.stage.outputs.dir }}" "${{ steps.version.outputs.archive }}"

      - name: Extract release notes
        if: steps.release.outputs.exists != 'true'
        id: notes
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.value }}"
          notes_file="${RUNNER_TEMP}/release-notes.md"

          # Extract the section for this version from CHANGELOG.md (between first and second ## heading)
          awk "/^## \[${version}\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md > "${notes_file}"

          # Fall back to empty notes if nothing was extracted
          if [[ ! -s "${notes_file}" ]]; then
            printf '' > "${notes_file}"
          fi

          echo "file=${notes_file}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.value }}"
          gh release create "${version}" "${{ steps.version.outputs.archive }}" --title "${version}" --notes-file "${{ steps.notes.outputs.file }}" --target "${GITHUB_SHA}"
