name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version segment to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    branches:
      - main
    paths:
      - VERSION

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    name: Prepare release PR
    runs-on: macos-15
    outputs:
      branch: ${{ steps.version.outputs.branch }}
      sha: ${{ steps.release_commit.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Ensure release runs from development
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/development" ]]; then
            echo "Run this workflow from development." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Configure git author
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump VERSION with semver
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # Use the latest git tag as the source of truth so the bump is
          # always based on the actual last release, even if the VERSION file
          # is stale (e.g. a back-merge PR was never merged).
          current_version="$(git describe --tags --abbrev=0 2>/dev/null | tr -d '[:space:]')"
          if [[ -z "${current_version}" ]]; then
            current_version="$(tr -d '[:space:]' < VERSION)"
          fi
          next_version="$(npx --yes semver@7.6.3 "${current_version}" -i "${{ inputs.bump }}")"
          release_branch="release/v${next_version}"

          if [[ -z "${next_version}" ]]; then
            echo "semver did not produce a version." >&2
            exit 1
          fi

          echo "current=${current_version}" >> "$GITHUB_OUTPUT"
          echo "next=${next_version}" >> "$GITHUB_OUTPUT"
          echo "branch=${release_branch}" >> "$GITHUB_OUTPUT"

      - name: Inspect release refs
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.next }}"

          if git ls-remote --exit-code --tags origin "refs/tags/${version}" >/dev/null 2>&1; then
            echo "Tag ${version} already exists." >&2
            exit 1
          fi

          if gh release view "${version}" >/dev/null 2>&1; then
            echo "Release ${version} already exists." >&2
            exit 1
          fi

      - name: Create release branch
        shell: bash
        run: |
          set -euo pipefail

          branch="${{ steps.version.outputs.branch }}"

          # Always (re)create from development so the release includes all
          # new changes — even on a rerun where the branch already exists.
          git fetch origin development
          git switch -c "${branch}" origin/development

          # Merge main to incorporate any commits not on development
          # (e.g. previous release chore commits)
          git merge origin/main --no-edit

      - name: Validate build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          ./build.sh

      - name: Update CHANGELOG
        id: changelog
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.next }}"
          prev_tag="${{ steps.version.outputs.current }}"
          # Resolve to a real git tag (tags have no v-prefix in this repo)
          if ! git rev-parse "${prev_tag}" >/dev/null 2>&1; then
            prev_tag="$(git describe --tags --abbrev=0 2>/dev/null || echo "")"
          fi
          today="$(date -u +%Y-%m-%d)"

          # Collect conventional commits since the previous tag.
          # --first-parent follows only the mainline (one entry per merged PR,
          # no duplicates from feature branch commits).
          features=""
          fixes=""
          while IFS= read -r line; do
            msg="${line#* }"
            if [[ "${msg}" == feat:* ]]; then
              features="${features}- ${msg#feat: }"$'\n'
            elif [[ "${msg}" == feat\(*\):* ]]; then
              rest="${msg#feat(}"
              features="${features}- ${rest#*): }"$'\n'
            elif [[ "${msg}" == fix:* ]]; then
              fixes="${fixes}- ${msg#fix: }"$'\n'
            elif [[ "${msg}" == fix\(*\):* ]]; then
              rest="${msg#fix(}"
              fixes="${fixes}- ${rest#*): }"$'\n'
            fi
          done < <(git log "${prev_tag}..HEAD" --oneline --first-parent 2>/dev/null || git log --oneline --first-parent)

          # Build the new changelog section
          new_section="## [${version}] - ${today}"$'\n'
          if [[ -n "${features}" ]]; then
            new_section+=$'\n### Features\n\n'"${features}"
          fi
          if [[ -n "${fixes}" ]]; then
            new_section+=$'\n### Bug Fixes\n\n'"${fixes}"
          fi

          # Prepend the new section after the header lines
          tmp="$(mktemp)"
          {
            awk '/^## \[/ { exit } { print }' CHANGELOG.md
            printf '\n%s\n' "${new_section}"
            awk 'found || /^## \[/ { found=1; print }' CHANGELOG.md
          } > "${tmp}"
          mv "${tmp}" CHANGELOG.md

      - name: Commit and push release changes
        id: release_commit
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.next }}"
          branch="${{ steps.version.outputs.branch }}"

          printf '%s\n' "${version}" > VERSION
          git add VERSION CHANGELOG.md
          git commit -m "chore(release): ${version}" -m "- bump VERSION to ${version}" -m "- update CHANGELOG.md"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push --force-with-lease --set-upstream origin "${branch}"

      - name: Open release pull request
        id: pr
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.next }}"
          branch="${{ steps.version.outputs.branch }}"

          # Extract the changelog section for this version to include in the PR body
          changelog_section="$(awk "/^## \[${version}\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)"

          pr_body="$(
            printf '## What'\''s changing\n\n%s\n\n## Validation\n- `./build.sh`\n' "${changelog_section}"
          )"

          # Close any existing release PR so the new one starts with a clean
          # check-suite (reused PRs carry stale required-check expectations
          # that GITHUB_TOKEN workflows can never satisfy).
          existing="$(gh pr list --head "${branch}" --base main --state open --json number --jq '.[0].number')"
          if [[ -n "${existing}" && "${existing}" != "null" ]]; then
            gh pr close "${existing}" --delete-branch=false --comment "Superseded by a new release run."
          fi

          pr_url="$(gh pr create --base main --head "${branch}" --title "chore(release): ${version}" --body "${pr_body}")"

          echo "url=${pr_url}" >> "$GITHUB_OUTPUT"

      - name: Write pull request summary
        shell: bash
        run: |
          {
            printf 'Release pull request: %s\n' "${{ steps.pr.outputs.url }}"
            printf 'Publish is skipped on workflow_dispatch by design.\n'
            printf 'Merge that pull request into main to trigger the publish job.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  release-tests:
    needs: prepare
    if: github.event_name == 'workflow_dispatch'
    name: Run tests
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out release branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.branch }}

      - name: Run tests
        id: tests
        shell: bash
        run: ./tests.sh

      - name: Publish test status
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          state="success"
          description="Test suite passed"
          if [[ "${{ steps.tests.outcome }}" != "success" ]]; then
            state="failure"
            description="Test suite failed"
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${{ needs.prepare.outputs.sha }}" \
            -f state="${state}" \
            -f context='Run tests' \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  release-lint:
    needs: prepare
    if: github.event_name == 'workflow_dispatch'
    name: Lint commit messages
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out release branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.branch }}
          fetch-depth: 0

      - name: Lint release commit
        id: lint
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json
          commitDepth: 1

      - name: Publish lint status
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          state="success"
          description="Commit messages passed"
          if [[ "${{ steps.lint.outcome }}" != "success" ]]; then
            state="failure"
            description="Commit message lint failed"
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${{ needs.prepare.outputs.sha }}" \
            -f state="${state}" \
            -f context='Lint commit messages' \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  release-branch-policy:
    needs: prepare
    if: github.event_name == 'workflow_dispatch'
    name: Check source branch
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate release source branch
        id: branch_policy
        shell: bash
        run: |
          set -euo pipefail

          branch="${{ needs.prepare.outputs.branch }}"
          echo "Source branch: ${branch}"

          if [[ "${branch}" != release/v* ]]; then
            echo "Expected release/v* branch, got ${branch}." >&2
            exit 1
          fi

      - name: Publish branch policy status
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          state="success"
          description="Release branch allowed"
          if [[ "${{ steps.branch_policy.outcome }}" != "success" ]]; then
            state="failure"
            description="Release branch policy failed"
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${{ needs.prepare.outputs.sha }}" \
            -f state="${state}" \
            -f context='Check source branch' \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  publish:
    if: github.event_name == 'push'
    name: Publish release
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          archive_path="${RUNNER_TEMP}/${version}.zip"

          if [[ -z "${version}" ]]; then
            echo "VERSION file is empty." >&2
            exit 1
          fi

          echo "value=${version}" >> "$GITHUB_OUTPUT"
          echo "archive=${archive_path}" >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.value }}"

          if gh release view "${version}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build screen saver
        if: steps.release.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          ./build.sh

      - name: Stage release files
        if: steps.release.outputs.exists != 'true'
        id: stage
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.value }}"
          release_dir="${RUNNER_TEMP}/MatrixScreenSaver-${version}"

          rm -rf "${release_dir}"
          mkdir -p "${release_dir}"
          ditto "build/MatrixScreenSaver.saver" "${release_dir}/MatrixScreenSaver.saver"

          echo "dir=${release_dir}" >> "$GITHUB_OUTPUT"

      - name: Create release archive
        if: steps.release.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          ditto -c -k --sequesterRsrc "${{ steps.stage.outputs.dir }}" "${{ steps.version.outputs.archive }}"

      - name: Extract release notes
        if: steps.release.outputs.exists != 'true'
        id: notes
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.value }}"
          notes_file="${RUNNER_TEMP}/release-notes.md"

          # Extract the section for this version from CHANGELOG.md (between first and second ## heading)
          awk "/^## \[${version}\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md > "${notes_file}"

          # Fall back to empty notes if nothing was extracted
          if [[ ! -s "${notes_file}" ]]; then
            printf '' > "${notes_file}"
          fi

          echo "file=${notes_file}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.value }}"
          gh release create "${version}" "${{ steps.version.outputs.archive }}" --title "${version}" --notes-file "${{ steps.notes.outputs.file }}" --target "${GITHUB_SHA}"

      - name: Back-merge main into development
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.value }}"
          pr_url="$(gh pr list --head main --base development --state open --json url --jq '.[0].url')"
          if [[ -z "${pr_url}" || "${pr_url}" == "null" ]]; then
            pr_url="$(gh pr create --base development --head main --title "chore: sync main into development after ${version}" --body "Automated back-merge of \`main\` into \`development\` following the ${version} release.")"
          fi
          gh pr merge "${pr_url}" --auto --merge
          echo "Back-merge PR: ${pr_url}" >> "$GITHUB_STEP_SUMMARY"
