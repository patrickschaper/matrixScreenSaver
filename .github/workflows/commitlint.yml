name: Commitlint

on:
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Lint commit messages
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Lint commits
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json
